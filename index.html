<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Great Jake | Tests</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f1115;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .home {
      width: min(820px, 100%);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 36px;
    }

    p {
      color: #b2b6c5;
      margin-top: 0;
    }

    .grid {
      display: grid;
      gap: 18px;
      margin-top: 32px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .card {
      background: #161a22;
      border-radius: 16px;
      padding: 22px;
      text-align: left;
      border: 1px solid #1e2430;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .card p {
      margin: 0 0 18px;
    }

    .card a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: #00ccff;
      color: #0f1115;
      text-decoration: none;
      font-weight: 600;
    }

    .card a:hover {
      background: #00ff88;
    }
  </style>
</head>
<body>
  <main class="home">
    <h1>Test Your Speed</h1>
    <p>Pick a challenge to see how fast you really are.</p>

    <section class="grid">
      <article class="card">
        <h2>CPS Test</h2>
        <p>Run the classic 10x one-second click test.</p>
        <a href="cps.html">Start CPS Test</a>
      </article>

      <article class="card">
        <h2>Keyboard Test</h2>
        <p>Type random dictionary words for one minute to reveal your WPM.</p>
        <a href="typing.html">Start Keyboard Test</a>
      </article>
    </section>
  </main>
</body>
</html>
