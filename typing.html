<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keyboard Test</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #0f1115;
    color: #fff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .container {
    width: min(860px, 100%);
  }

  .back-link {
    display: inline-block;
    margin-bottom: 18px;
    color: #00ccff;
    text-decoration: none;
  }

  .back-link:hover {
    color: #00ff88;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 32px;
  }

  .sub {
    margin: 0 0 20px;
    color: #b2b6c5;
  }

  .status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    background: #161a22;
    border-radius: 14px;
    padding: 14px 18px;
  }

  .status span {
    font-weight: 600;
  }

  .timer {
    font-size: 22px;
    color: #00ff88;
  }

  .word-box {
    background: #161a22;
    border-radius: 18px;
    padding: 26px;
    min-height: 140px;
    border: 1px solid #1e2430;
    line-height: 1.8;
    font-size: 20px;
  }

  .word-box span {
    margin-right: 6px;
  }

  .word-box .current {
    color: #00ccff;
    border-bottom: 2px solid #00ccff;
  }

  .word-box .correct {
    color: #00ff88;
  }

  .word-box .incorrect {
    color: #ff6b6b;
  }

  .input-row {
    margin-top: 18px;
    display: flex;
    gap: 12px;
  }

  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #2a3140;
    background: #0f1115;
    color: #fff;
    font-size: 18px;
  }

  .primary-btn {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    background: #00ccff;
    color: #0f1115;
    font-weight: 600;
    cursor: pointer;
  }

  .primary-btn:hover {
    background: #00ff88;
  }

  .result {
    margin-top: 18px;
    font-size: 22px;
    font-weight: 600;
    color: #00ff88;
  }

  .helper {
    margin-top: 8px;
    color: #8f96a8;
    font-size: 14px;
  }
</style>
</head>
<body>
  <main class="container">
    <a class="back-link" href="index.html">← Back to home</a>
    <h1>Keyboard Test</h1>
    <p class="sub">Type the words for 60 seconds. Your average WPM will appear when the timer ends.</p>

    <div class="status">
      <div>WPM: <span id="wpm">0</span></div>
      <div class="timer" id="timer">60s</div>
    </div>

    <section class="word-box" id="wordBox"></section>

    <div class="input-row">
      <input id="wordInput" type="text" placeholder="Start typing here..." autocomplete="off" />
      <button class="primary-btn" id="startBtn">Start</button>
    </div>
    <div class="result" id="result"></div>
    <div class="helper">Tip: Press space after each word. Accuracy matters!</div>
  </main>

    "trade", "trail", "train", "travel", "treat", "trend", "trial", "trust", "truth", "tunnel",
    "turn", "tutor", "twenty", "twice", "unable", "uncle", "under", "unit", "update", "upper",
    "urban", "useful", "usual", "value", "valley", "vast", "venue", "version", "video", "village",
    "visual", "voice", "volume", "wage", "wait", "walk", "wall", "wander", "warm", "watch",
    "water", "wealth", "weapon", "weather", "week", "weight", "welcome", "western", "window", "winner",
    "winter", "wisdom", "wonder", "world", "writer", "yellow", "yield", "young", "youth", "zebra"
  ];

  const wordBox = document.getElementById("wordBox");
  const wordInput = document.getElementById("wordInput");
  const startBtn = document.getElementById("startBtn");
  const timerEl = document.getElementById("timer");
  const wpmEl = document.getElementById("wpm");
  const resultEl = document.getElementById("result");

  let words = [];
  let currentIndex = 0;
  let timer = null;
  let startTime = null;
  let timeLeft = 60;
  let correctChars = 0;
  let running = false;

  function shuffleWords() {
    const pool = Array.from({ length: 200 }, () => wordBank[Math.floor(Math.random() * wordBank.length)]);
    words = pool;
  }

  function renderWords() {
    wordBox.innerHTML = "";
    words.forEach((word, index) => {
      const span = document.createElement("span");
      span.textContent = word;
      if (index === currentIndex) {
        span.classList.add("current");
      }
      wordBox.appendChild(span);
    });
  }

  function resetTest() {
    currentIndex = 0;
    timeLeft = 60;
    correctChars = 0;
    running = false;
    wpmEl.textContent = "0";
    timerEl.textContent = "60s";
    resultEl.textContent = "";
    wordInput.value = "";
    wordInput.disabled = true;
    shuffleWords();
    renderWords();
  }

  function startTest() {
    if (running) {
      return;
    }
    running = true;
    wordInput.disabled = false;
    wordInput.focus();
    startTime = performance.now();
    timer = setInterval(updateTimer, 1000);
  }

  function updateTimer() {
    timeLeft -= 1;
    timerEl.textContent = `${timeLeft}s`;

    const elapsedMinutes = (60 - timeLeft) / 60;
    const currentWpm = elapsedMinutes > 0 ? Math.round((correctChars / 5) / elapsedMinutes) : 0;
    wpmEl.textContent = currentWpm;

    if (timeLeft <= 0) {
      endTest();
    }
  }

  function endTest() {
    clearInterval(timer);
    running = false;
    wordInput.disabled = true;
    const elapsedMinutes = 1;
    const finalWpm = Math.round((correctChars / 5) / elapsedMinutes);
    wpmEl.textContent = finalWpm;
    resultEl.textContent = `Average WPM: ${finalWpm}`;
  }

  function checkWord(value) {
    const currentWord = words[currentIndex];
    const spans = wordBox.querySelectorAll("span");
    if (!currentWord) {
      return;
    }

    if (value === currentWord) {
      spans[currentIndex].classList.add("correct");
      correctChars += currentWord.length;
    } else {
      spans[currentIndex].classList.add("incorrect");
    }

    spans[currentIndex].classList.remove("current");
    currentIndex += 1;

    if (currentIndex < spans.length) {
      spans[currentIndex].classList.add("current");
    } else {
      shuffleWords();
      renderWords();
      currentIndex = 0;
    }
  }

  wordInput.addEventListener("keydown", (event) => {
    if (!running) {
      return;
    }

    if (event.key === " ") {
      event.preventDefault();
      const value = wordInput.value.trim();
      if (value.length > 0) {
        checkWord(value);
      }
      wordInput.value = "";
    }
  });

  startBtn.addEventListener("click", () => {
    resetTest();
    startTest();
  });

  resetTest();
</script>

</html>
